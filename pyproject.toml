[project]
name = "panasa-agent-builder-runtime"
version = "1.0.0"
description = "Panasa Enterprise Agent Factory Runtime"
requires-python = ">=3.12"
# Section 32.3/R31: kept in lockstep with requirements.txt (pip's own
# install path, still documented in Section 16's Local Dev Quick Start) —
# this list is what `uv sync`/`uv lock` resolve against; requirements.txt
# is what plain `pip install -r` reads. Update both together.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.14.1",
    "boto3==1.35.90",
    "structlog==24.4.0",
    "pyjwt[crypto]==2.10.1",
    "packaging==24.2",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "bcrypt==4.2.1",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "litellm==1.96.2",
    "redis==8.1.0",
    "aws-xray-sdk==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
    "moto[dynamodb,s3,secretsmanager,codebuild]==5.0.28",
    "aiosqlite==0.20.0",
    "fakeredis==2.37.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
