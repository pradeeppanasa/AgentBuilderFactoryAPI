services:
  agent-builder-runtime:
    build: .
    container_name: agent-builder-runtime
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - SECRETS_MANAGER_ENDPOINT=http://localstack:4566
      - S3_ENDPOINT=http://localstack:4566
      - IAC_OUTPUT_BUCKET=panasa-iac-artifacts-local
      - DATABASE_URL=postgresql+asyncpg://panasa:panasa@postgres:5432/panasa_agent_builder
      - REDIS_URL=redis://redis:6379/0
      # DynamoDB Local/LocalStack don't validate these, but boto3 refuses to
      # sign ANY request (even to a local emulator) without something
      # present — there's no IAM role to fall back to outside real AWS.
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    depends_on:
      - dynamodb-local
      - localstack
      - postgres
      - redis

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8001:8000"

  localstack:
    # :latest now requires a paid LocalStack account (confirmed: it exits at
    # startup with "License activation failed" / exit code 55, even for
    # community-tier services like S3/SecretsManager). 3.8 predates that
    # enforcement and starts anonymously — pin deliberately, same reasoning
    # as the Dockerfile's uv pin.
    image: localstack/localstack:3.8
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=secretsmanager,sts,s3,events,stepfunctions
      - DEBUG=0

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      # Mapped to 5433, not 5432: this machine already has a native Windows
      # PostgreSQL service bound to 5432, which silently intercepts host
      # connections meant for this container (docker exec still reaches the
      # container fine over its internal loopback — only host->5432 TCP is
      # hijacked). Left the native service alone and moved this instead.
      - "5433:5432"
    environment:
      - POSTGRES_USER=panasa
      - POSTGRES_PASSWORD=panasa
      - POSTGRES_DB=panasa_agent_builder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panasa -d panasa_agent_builder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: panasa-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
