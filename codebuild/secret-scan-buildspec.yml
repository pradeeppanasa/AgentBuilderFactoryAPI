version: 0.2

# Panasa Agent Builder — SECURITY_SCANNING / secret_scan branch (Section 6.2,
# Trufflehog). See sast-buildspec.yml's header for the shared caveats.

env:
  variables:
    STAGE_NAME: "SECURITY_SCANNING"

phases:
  install:
    commands:
      - curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
  build:
    commands:
      - trufflehog filesystem . --json --no-update > /tmp/trufflehog.json || true
      - echo "SECRET_COUNT=$(wc -l < /tmp/trufflehog.json | tr -d ' ')" >> /tmp/build-env
  post_build:
    commands:
      - source /tmp/build-env
      - |
        if [ "${SECRET_COUNT:-0}" -gt 0 ]; then
          bash "$CODEBUILD_SRC_DIR/codebuild/scripts/write_stage_result.sh" "$STAGE_NAME" FAILED \
            "Secret scan: ${SECRET_COUNT} verified finding(s)" "hardcoded_secret_found"
          exit 1
        else
          bash "$CODEBUILD_SRC_DIR/codebuild/scripts/write_stage_result.sh" "$STAGE_NAME" PASSED "Secret scan: clean"
        fi
