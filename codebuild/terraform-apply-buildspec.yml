version: 0.2

# Panasa Agent Builder — APPLYING stage (terraform apply).
# Only runs after POLICY_CHECK=PASS (F1) — Step Functions never invokes
# this build otherwise. Reconciles the customer's actual AWS resources
# toward the desired Terraform generated by the Runtime (F2's "Lambda
# deletion scenario": terraform refresh here is what notices and recreates
# anything manually changed outside Terraform).

env:
  variables:
    STAGE_NAME: "APPLYING"

phases:
  install:
    commands:
      # R43: pinned everywhere terraform is installed (this buildspec,
      # Dockerfile, scripts/local-setup.sh) — never :latest/whatever the
      # build image happens to ship, and the version must match exactly.
      - curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
      - unzip -q /tmp/terraform.zip -d /usr/local/bin
      - rm /tmp/terraform.zip
      - terraform -version
      - jq --version
  build:
    commands:
      - bash codebuild/scripts/write_stage_result.sh "$STAGE_NAME" RUNNING
      - cd "terraform/agents/${AGENT_ID}"
      - terraform init
      - |
        if terraform apply -auto-approve tfplan > /tmp/apply-output.txt 2>&1; then
          echo "APPLY_STATUS=PASSED" >> /tmp/build-env
        else
          echo "APPLY_STATUS=FAILED" >> /tmp/build-env
        fi
  post_build:
    commands:
      - source /tmp/build-env
      - APPLY_SUMMARY=$(tail -c 4000 /tmp/apply-output.txt)
      - |
        if [ "$APPLY_STATUS" = "PASSED" ]; then
          bash "$CODEBUILD_SRC_DIR/codebuild/scripts/write_stage_result.sh" \
            "$STAGE_NAME" PASSED "$APPLY_SUMMARY"
          aws dynamodb update-item \
            --table-name "$DYNAMODB_DEPLOYMENTS_TABLE" \
            --key "{\"agent_id\": {\"S\": \"$AGENT_ID\"}, \"deployment_id\": {\"S\": \"$DEPLOYMENT_ID\"}}" \
            --update-expression "SET terraform_apply_output = :output" \
            --expression-attribute-values "{\":output\": {\"S\": $(echo "$APPLY_SUMMARY" | jq -Rs .)}}"
        else
          bash "$CODEBUILD_SRC_DIR/codebuild/scripts/write_stage_result.sh" \
            "$STAGE_NAME" FAILED "$APPLY_SUMMARY"
          exit 1
        fi
